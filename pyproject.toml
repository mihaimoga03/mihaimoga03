[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestio"
version = "0.1.0"
description = "Agent de contabilitate, gestiune clienti si stocuri, construit pe Claude API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gestio = "gestio.cli:main"

[tool.setuptools.packages.find]
include = ["gestio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
